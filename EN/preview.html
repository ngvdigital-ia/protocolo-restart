  <script>
    const frame = document.getElementById('post-pitch');
    function resizePostPitch() {
      const doc = frame.contentDocument;
      if (!doc) return;
      frame.style.height = `${Math.max(doc.body.scrollHeight, doc.documentElement.scrollHeight)}px`;

      [0, 500, 1500, 3000].forEach(delay => setTimeout(resizePostPitch, delay));
    });
